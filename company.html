<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運営会社 - Relight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        
        * {
            font-family: 'Noto Sans JP', sans-serif;
        }

        body {
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="antialiased">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <nav class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <img src="images/RELIGHT_icon.png" alt="Relight Logo" class="w-10 h-10 rounded">
                    <span class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">Relight</span>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-700 hover:text-blue-600 transition">ホーム</a>
                    <a href="index.html#features" class="text-gray-700 hover:text-blue-600 transition">機能</a>
                    <a href="index.html#pricing" class="text-gray-700 hover:text-blue-600 transition">料金</a>
                    <a href="contact.html" class="text-gray-700 hover:text-blue-600 transition">お問い合わせ</a>
                </div>
                <a href="index.html#pricing" class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-6 py-2 rounded-full hover:shadow-lg transition">
                    無料で始める
                </a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-16 max-w-4xl">
        <!-- Page Title -->
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4">運営会社</h1>
            <p class="text-lg text-gray-600">Company Information</p>
        </div>

        <!-- Company Information -->
        <div class="bg-white rounded-2xl shadow-lg p-8 md:p-12">
            <table class="w-full">
                <tbody class="divide-y divide-gray-200">
                    <tr>
                        <th class="py-6 pr-8 text-left text-gray-600 font-medium w-1/3">事業者名</th>
                        <td class="py-6 text-gray-900">Relight</td>
                    </tr>
                    <tr>
                        <th class="py-6 pr-8 text-left text-gray-600 font-medium">設立</th>
                        <td class="py-6 text-gray-900">2026年2月</td>
                    </tr>
                    <tr>
                        <th class="py-6 pr-8 text-left text-gray-600 font-medium">代表者</th>
                        <td class="py-6 text-gray-900">能登 健二</td>
                    </tr>
                    <tr>
                        <th class="py-6 pr-8 text-left text-gray-600 font-medium">所在地</th>
                        <td class="py-6 text-gray-900">
                            〒224-0062<br>
                            神奈川県横浜市都筑区葛が谷14-3
                        </td>
                    </tr>
                    <tr>
                        <th class="py-6 pr-8 text-left text-gray-600 font-medium">事業内容</th>
                        <td class="py-6 text-gray-900">
                            • AI技術を活用したEC商品画像自動処理サービスの開発・提供<br>
                            • ECサイト運営支援ツールの企画・開発<br>
                            • 画像認識・機械学習技術のコンサルティング
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>

        <!-- Back to Home -->
        <div class="text-center mt-16">
            <a href="index.html" class="inline-flex items-center text-blue-600 hover:text-blue-700 font-medium">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                トップページに戻る
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-12 mt-24">
        <div class="container mx-auto px-6">
            <div class="text-center">
                <div class="flex items-center justify-center gap-2 mb-4">
                    <img src="images/RELIGHT_icon.png" alt="Relight Logo" class="w-8 h-8 rounded">
                    <span class="text-xl font-bold text-white">Relight</span>
                </div>
                <div class="border-t border-gray-800 pt-8 text-xs text-gray-600">
                    &copy; 2025 Relight. All rights reserved.
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
