<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景削除ツール - Powered by Hugging Face</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-12 max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4">
                <i class="fa-solid fa-wand-magic-sparkles text-purple-600 mr-3"></i>
                背景削除ツール
            </h1>
            <p class="text-gray-600 text-lg">
                AIで画像の背景を自動削除 - 完全無料
            </p>
            <div class="mt-4 inline-flex items-center gap-2 px-4 py-2 bg-green-100 text-green-700 rounded-full text-sm">
                <i class="fa-solid fa-circle-check"></i>
                <span>Hugging Face Spaces API使用</span>
            </div>
        </div>

        <!-- Main Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <!-- Upload Area -->
            <div id="uploadArea" class="border-2 border-dashed border-gray-300 rounded-xl p-12 text-center hover:border-purple-500 transition-all cursor-pointer mb-8">
                <input type="file" id="imageInput" accept="image/*" class="hidden">
                <label for="imageInput" class="cursor-pointer block">
                    <i class="fa-solid fa-cloud-arrow-up text-6xl text-gray-400 mb-4"></i>
                    <p class="text-xl font-semibold text-gray-700 mb-2">画像を選択またはドロップ</p>
                    <p class="text-sm text-gray-500">PNG, JPG, JPEG対応（最大10MB）</p>
                </label>
            </div>

            <!-- Image Preview & Result -->
            <div id="previewContainer" class="hidden">
                <div class="grid md:grid-cols-2 gap-8 mb-8">
                    <!-- Original Image -->
                    <div>
                        <h3 class="text-lg font-semibold mb-3 text-gray-700">
                            <i class="fa-solid fa-image mr-2 text-blue-600"></i>
                            元画像
                        </h3>
                        <div class="border-2 border-gray-200 rounded-xl overflow-hidden bg-gray-50">
                            <img id="originalImage" src="" alt="元画像" class="w-full h-auto">
                        </div>
                    </div>

                    <!-- Processed Image -->
                    <div>
                        <h3 class="text-lg font-semibold mb-3 text-gray-700">
                            <i class="fa-solid fa-sparkles mr-2 text-purple-600"></i>
                            背景削除後
                        </h3>
                        <div id="resultContainer" class="border-2 border-gray-200 rounded-xl overflow-hidden relative" style="background-image: linear-gradient(45deg, #ddd 25%, transparent 25%, transparent 75%, #ddd 75%, #ddd), linear-gradient(45deg, #ddd 25%, transparent 25%, transparent 75%, #ddd 75%, #ddd); background-size: 20px 20px; background-position: 0 0, 10px 10px;">
                            <img id="resultImage" src="" alt="処理済み画像" class="w-full h-auto hidden">
                            <div id="loadingSpinner" class="absolute inset-0 flex items-center justify-center bg-white/80">
                                <div class="text-center">
                                    <i class="fa-solid fa-spinner fa-spin text-4xl text-purple-600 mb-2"></i>
                                    <p class="text-sm text-gray-600">処理中...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-4 justify-center flex-wrap">
                    <button id="downloadBtn" class="px-6 py-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-bold rounded-xl hover:shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-download mr-2"></i>
                        ダウンロード
                    </button>
                    <button id="resetBtn" class="px-6 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 transition-all">
                        <i class="fa-solid fa-rotate-left mr-2"></i>
                        別の画像を選択
                    </button>
                </div>
            </div>
        </div>

        <!-- Features -->
        <div class="mt-12 grid md:grid-cols-3 gap-6">
            <div class="text-center p-6">
                <div class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-bolt text-2xl text-purple-600"></i>
                </div>
                <h3 class="font-bold text-gray-900 mb-2">高速処理</h3>
                <p class="text-sm text-gray-600">最新AIモデルで数秒で処理完了</p>
            </div>
            <div class="text-center p-6">
                <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-gem text-2xl text-blue-600"></i>
                </div>
                <h3 class="font-bold text-gray-900 mb-2">高品質</h3>
                <p class="text-sm text-gray-600">髪の毛や細部まで精密に切り抜き</p>
            </div>
            <div class="text-center p-6">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-lock text-2xl text-green-600"></i>
                </div>
                <h3 class="font-bold text-gray-900 mb-2">安全・無料</h3>
                <p class="text-sm text-gray-600">完全無料、画像は保存されません</p>
            </div>
        </div>
    </div>

    <script>
        const API_ENDPOINT = 'https://jinkedon-withoutbg-api.hf.space/api/remove-bg';
        
        const imageInput = document.getElementById('imageInput');
        const uploadArea = document.getElementById('uploadArea');
        const previewContainer = document.getElementById('previewContainer');
        const originalImage = document.getElementById('originalImage');
        const resultImage = document.getElementById('resultImage');
        const resultContainer = document.getElementById('resultContainer');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');

        let processedImageUrl = null;

        // File input change
        imageInput.addEventListener('change', handleFileSelect);

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('border-purple-500');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('border-purple-500');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-purple-500');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                processImage(file);
            }
        });

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                processImage(file);
            }
        }

        async function processImage(file) {
            // Validate file size
            if (file.size > 10 * 1024 * 1024) {
                alert('ファイルサイズは10MB以下にしてください。');
                return;
            }

            // Show preview container
            previewContainer.classList.remove('hidden');
            
            // Show original image
            const reader = new FileReader();
            reader.onload = (e) => {
                originalImage.src = e.target.result;
            };
            reader.readAsDataURL(file);

            // Show loading
            loadingSpinner.classList.remove('hidden');
            resultImage.classList.add('hidden');
            downloadBtn.disabled = true;

            try {
                // Convert to base64
                const base64 = await fileToBase64(file);
                
                // Call API
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image: base64
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const result = await response.json();
                
                // Display result
                if (result.success && result.image) {
                    processedImageUrl = result.image;
                    resultImage.src = result.image;
                    resultImage.classList.remove('hidden');
                    downloadBtn.disabled = false;
                } else {
                    throw new Error(result.error || 'Unknown error');
                }

            } catch (error) {
                console.error('Error:', error);
                alert(`エラーが発生しました: ${error.message}`);
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Download button
        downloadBtn.addEventListener('click', () => {
            if (processedImageUrl) {
                const link = document.createElement('a');
                link.href = processedImageUrl;
                link.download = 'background-removed.png';
                link.click();
            }
        });

        // Reset button
        resetBtn.addEventListener('click', () => {
            previewContainer.classList.add('hidden');
            imageInput.value = '';
            processedImageUrl = null;
        });
    </script>
</body>
</html>
